on:
  workflow_call:
    inputs:
      PREVIOUS_TAG_PATTERN:
        type: string
    outputs:
      version:
        description: "The current release version"
        value: ${{ jobs.setup_release.outputs.version }}
      previous_tag:
        description: "The previous tag used for changelog comparison"
        value: ${{ jobs.setup_release.outputs.previous_tag }}

jobs:

  setup_release:
    name: Setup GitHub Releases Publish

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.calculate_release_info.outputs.version }}
      previous_tag: ${{ steps.calculate_release_info.outputs.previous_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Version and Previous Tag
        id: calculate_release_info
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # TODO: Remove
          echo 'git tag'
          git tag
          
          echo 'git tag list with hard coded pattern'
          git tag --list 'v*.*.*-pre'
          
          echo 'git tag list with env pattern'
          git tag --list $env:PREVIOUS_TAG_PATTERN
          
          echo 'git tag list with env pattern in quotes'
          git tag --list '$env:PREVIOUS_TAG_PATTERN'

          PREVIOUS_TAG="$(git tag --list '$env:PREVIOUS_TAG_PATTERN' --sort=-v:refname | grep -Fvx "$TAG" | head -n 1 || true)"
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
        env:
          PREVIOUS_TAG_PATTERN: ${{ inputs.PREVIOUS_TAG_PATTERN }}
